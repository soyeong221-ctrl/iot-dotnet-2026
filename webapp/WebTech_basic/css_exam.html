<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 예제</title>

    <!-- CSS 스타일을 HTML과 같은 파일에 위치 -->
    <style>
        body{
            margin: auto 0; /* html 태그 사이의 여백 조절 */
            background-color: beige; /* body 태그에 배경색 지정 */
        }

        h2{
            color:blue; /* 제목 글자색 변경 */
        }

        p{
            font-size: 20px;    /* p태그 기본 글자 크기 16px */
        }

        /* class highlight */
        .highlight {
            color: crimson;
            font-weight: bold;
        }

        .btn {
            border: none;
            padding: 10px 20px;
        }

    </style>

</head>
<body>
    <h2>CSS 실습</h2>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. At, quis.</p>
    
    <p class="highlight">Lorem ipsum dolor sit amet consectetur adipisicing elit. <br>
                         Vel amet possimus pariatur voluptate accusantium ratione?</p>

    <button class="btn btn-primary">확인</button>





</body>
</html>
