[env:esp32cam]
platform = espressif32@6.6.0
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 115200

monitor_rts = 0
monitor_dtr = 0

upload_port = COM6
monitor_port = COM6
; 리눅스의 경우
;upload_port = /dev/ttyUSB0
;monitor_port = /dev/ttyUSB0

; 외부 RAM 사용
build_flags = 
    -DBOARD_HAS_PSRAM